name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Maintenance script compiles
        run: python3 -m py_compile tools/catalog.py

      - name: Skill schema is valid JSON
        run: python3 -c "import json; json.load(open('schemas/skill.schema.json'))"

      - name: Every skill passes schema validation
        run: python3 tools/catalog.py validate

      - name: Scope rule is present
        run: |
          grep -q "hard rule — scope" methodology.md || { echo "::error::methodology.md missing scope rule"; exit 1; }
          test -f skills/tradecraft/tradecraft-scope-roe/SKILL.md || { echo "::error::scope-roe skill missing"; exit 1; }

      - name: Generated indexes are up to date
        run: |
          python3 tools/catalog.py >/dev/null
          if ! git diff --quiet -- CATALOG.md COVERAGE.md; then
            echo "::error::CATALOG.md / COVERAGE.md are stale. Run: python3 tools/catalog.py"
            git --no-pager diff -- CATALOG.md COVERAGE.md
            exit 1
          fi
