<text class="ln ln0" x="26" y="78"><tspan fill="#39d353">$ </tspan><tspan fill="#e6edf3">git clone github.com/NoorQureshi/SploitAgent &amp;&amp; cd SploitAgent</tspan></text><text class="ln ln1" x="26" y="104"><tspan fill="#39d353">$ </tspan><tspan fill="#e6edf3">claude</tspan></text><text class="ln ln3" x="26" y="156"><tspan fill="#58a6ff">› </tspan><tspan fill="#e6edf3">assess api.acme.tld (authorized) for access-control bugs</tspan></text><text class="ln ln5" x="26" y="208"><tspan fill="#a371f7">● </tspan><tspan fill="#e6edf3">tradecraft-scope-roe</tspan><tspan fill="#9aa4b2">   scope confirmed · api.acme.tld</tspan></text><text class="ln ln6" x="26" y="234"><tspan fill="#a371f7">● </tspan><tspan fill="#e6edf3">recon-techstack-fingerprinting</tspan><tspan fill="#9aa4b2">   Django + DRF · Cloudflare WAF</tspan></text><text class="ln ln7" x="26" y="260"><tspan fill="#a371f7">● </tspan><tspan fill="#e6edf3">api-bola</tspan><tspan fill="#9aa4b2">   probing object references…</tspan></text><text class="ln ln8" x="26" y="286"><tspan fill="#39d353">    ✓ </tspan><tspan fill="#9aa4b2">/api/v1/orders/{id} → leaks other tenants' orders</tspan></text><text class="ln ln9" x="26" y="312"><tspan fill="#a371f7">● </tspan><tspan fill="#e6edf3">web-idor</tspan><tspan fill="#9aa4b2">   confirmed cross-tenant read (2 accounts)</tspan></text><text class="ln ln10" x="26" y="338"><tspan fill="#a371f7">● </tspan><tspan fill="#e6edf3">reporting-triage-validation</tspan><tspan fill="#9aa4b2">   CVSS 8.1 · High · deduped</tspan></text><text class="ln ln12" x="26" y="390"><tspan fill="#39d353">✔ </tspan><tspan fill="#e6edf3">report </tspan><tspan fill="#9aa4b2">→ engagements/acme/findings/bola-orders.md</tspan></text>
