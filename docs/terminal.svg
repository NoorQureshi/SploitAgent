<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 586" width="880" height="586" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" role="img" aria-label="A Claude Code terminal session using SploitAgent: describe a task in plain English and the matching skill loads to work an authorized target from recon to report.">
<style>text{font-size:15px;white-space:pre}</style>
